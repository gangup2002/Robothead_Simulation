<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>🤖 Robot Lip Sync</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #05080f;
  --panel: #080d18;
  --border: #1a3050;
  --accent: #00c8ff;
  --accent2: #ff6a00;
  --text: #7ab8d4;
  --dim: #2a4a6a;
  --green: #00ff88;
  --red: #ff3355;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: var(--bg);
  font-family: 'Share Tech Mono', monospace;
  color: var(--text);
  overflow: hidden;
  height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ── TOP BAR ── */
#topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 20px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  z-index: 10;
}
#topbar h1 {
  font-family: 'Orbitron', monospace;
  font-size: 13px; font-weight: 700;
  color: var(--accent);
  letter-spacing: 4px;
  text-transform: uppercase;
}
.status-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 8px var(--green);
  animation: pulse-dot 1.5s infinite;
  display: inline-block; margin-right: 6px;
}
@keyframes pulse-dot { 0%,100%{opacity:1} 50%{opacity:0.3} }
#sys-status { font-size: 10px; color: var(--green); letter-spacing: 2px; }

/* ── MAIN LAYOUT ── */
#main {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* ── 3D VIEWPORT ── */
#viewport {
  flex: 1;
  position: relative;
}
#viewport canvas { display: block; width: 100% !important; height: 100% !important; }

/* ── SCAN LINE OVERLAY ── */
#viewport::after {
  content: '';
  position: absolute; inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0,200,255,0.015) 2px,
    rgba(0,200,255,0.015) 4px
  );
  pointer-events: none;
  z-index: 5;
}

/* ── RIGHT PANEL ── */
#panel {
  width: 340px;
  background: var(--panel);
  border-left: 1px solid var(--border);
  display: flex; flex-direction: column;
  overflow-y: auto;
  flex-shrink: 0;
}
.panel-section {
  padding: 16px;
  border-bottom: 1px solid var(--border);
}
.section-title {
  font-family: 'Orbitron', monospace;
  font-size: 9px; font-weight: 700;
  color: var(--accent);
  letter-spacing: 3px;
  text-transform: uppercase;
  margin-bottom: 12px;
  display: flex; align-items: center; gap: 8px;
}
.section-title::before {
  content: '';
  display: block; width: 3px; height: 12px;
  background: var(--accent);
  box-shadow: 0 0 6px var(--accent);
}

/* ── TEXT INPUT ── */
#lipsync-input {
  width: 100%;
  background: #030608;
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--accent);
  font-family: 'Share Tech Mono', monospace;
  font-size: 14px;
  padding: 12px;
  resize: none;
  height: 80px;
  outline: none;
  transition: border-color 0.2s;
  letter-spacing: 1px;
}
#lipsync-input:focus { border-color: var(--accent); box-shadow: 0 0 12px rgba(0,200,255,0.15); }
#lipsync-input::placeholder { color: var(--dim); }

/* ── SPEAK BUTTON ── */
#speak-btn {
  width: 100%; margin-top: 10px;
  padding: 12px;
  background: transparent;
  border: 1px solid var(--accent);
  color: var(--accent);
  font-family: 'Orbitron', monospace;
  font-size: 11px; font-weight: 700;
  letter-spacing: 4px;
  text-transform: uppercase;
  cursor: pointer;
  border-radius: 4px;
  transition: all 0.2s;
  position: relative;
  overflow: hidden;
}
#speak-btn::before {
  content: '';
  position: absolute; inset: 0;
  background: var(--accent);
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 0.2s;
  z-index: -1;
}
#speak-btn:hover { color: var(--bg); }
#speak-btn:hover::before { transform: scaleX(1); }
#speak-btn.speaking {
  background: var(--accent2);
  border-color: var(--accent2);
  color: white;
  animation: speaking-pulse 0.4s infinite alternate;
}
@keyframes speaking-pulse {
  from { box-shadow: 0 0 8px var(--accent2); }
  to   { box-shadow: 0 0 22px var(--accent2); }
}

/* ── PHONEME VISUALISER ── */
#phoneme-display {
  background: #030608;
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 10px;
  min-height: 36px;
  display: flex; flex-wrap: wrap; gap: 4px;
  align-items: center;
}
.ph-token {
  display: inline-flex; flex-direction: column; align-items: center;
  padding: 2px 6px;
  border-radius: 3px;
  border: 1px solid var(--dim);
  font-size: 11px; line-height: 1.3;
  transition: all 0.08s;
  min-width: 24px;
}
.ph-token .ph-char { color: var(--text); font-size: 12px; font-weight: bold; }
.ph-token .ph-angle { font-size: 8px; color: var(--dim); }
.ph-token.active {
  background: rgba(0,200,255,0.15);
  border-color: var(--accent);
  box-shadow: 0 0 8px rgba(0,200,255,0.4);
  transform: scale(1.1);
}
.ph-token.active .ph-char { color: var(--accent); }
.ph-token.active .ph-angle { color: var(--accent2); }
.ph-token.done { opacity: 0.35; }

/* ── JAW METER ── */
#jaw-meter-wrap {
  display: flex; align-items: center; gap: 10px;
  margin-top: 10px;
}
#jaw-meter-label { font-size: 10px; color: var(--dim); width: 60px; }
#jaw-meter-bar {
  flex: 1; height: 8px;
  background: #0a1525;
  border: 1px solid var(--border);
  border-radius: 4px;
  overflow: hidden;
}
#jaw-meter-fill {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  border-radius: 4px;
  transition: width 0.05s;
  box-shadow: 0 0 6px var(--accent);
}
#jaw-meter-val { font-size: 10px; color: var(--accent2); width: 36px; text-align: right; }

/* ── PHONEME REFERENCE TABLE ── */
.phoneme-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 4px;
}
.ph-ref {
  background: #030608;
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 5px 4px;
  text-align: center;
  cursor: pointer;
  transition: all 0.15s;
  font-size: 10px;
}
.ph-ref:hover { border-color: var(--accent); background: rgba(0,200,255,0.08); }
.ph-ref .ph-ref-char { color: var(--accent); font-size: 13px; font-weight: bold; display: block; }
.ph-ref .ph-ref-deg  { color: var(--accent2); font-size: 9px; }
.ph-ref .ph-ref-name { color: var(--dim); font-size: 8px; letter-spacing: 1px; }

/* ── MANUAL CONTROLS ── */
.slider-row { margin-bottom: 10px; }
.slider-row label {
  display: flex; justify-content: space-between;
  font-size: 10px; color: var(--dim);
  margin-bottom: 4px; letter-spacing: 1px;
}
.slider-row label span { color: var(--accent2); }
input[type=range] {
  width: 100%; accent-color: var(--accent);
  height: 3px; cursor: pointer;
}

/* ── QUICK PHRASES ── */
.phrase-btn {
  display: inline-block;
  padding: 4px 10px; margin: 3px 2px;
  border: 1px solid var(--dim);
  border-radius: 20px;
  font-size: 10px; color: var(--dim);
  cursor: pointer; transition: all 0.15s;
  letter-spacing: 1px;
  background: transparent;
}
.phrase-btn:hover { border-color: var(--accent); color: var(--accent); }

/* ── ACTION BTNS ── */
.action-row { display: flex; gap: 6px; margin-top: 8px; }
.act-btn {
  flex: 1; padding: 7px 4px;
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text);
  font-family: 'Share Tech Mono', monospace;
  font-size: 10px; letter-spacing: 1px;
  cursor: pointer; border-radius: 3px;
  transition: all 0.15s;
}
.act-btn:hover { border-color: var(--accent); color: var(--accent); }
.act-btn.on { border-color: var(--accent2); color: var(--accent2); }

/* ── WAVEFORM ── */
#waveform {
  height: 40px; width: 100%;
  background: #030608;
  border: 1px solid var(--border);
  border-radius: 4px;
  overflow: hidden;
  position: relative;
}
#waveform canvas { display: block; }

/* ── LOADING ── */
#loading {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: var(--bg);
  z-index: 20;
}
#loading .load-title {
  font-family: 'Orbitron', monospace;
  font-size: 18px; color: var(--accent);
  letter-spacing: 6px; margin-bottom: 20px;
}
.load-bar-wrap {
  width: 260px; height: 3px;
  background: var(--border);
  border-radius: 2px; overflow: hidden;
}
.load-bar-fill {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  border-radius: 2px;
  animation: loadup 1.2s ease-out forwards;
}
@keyframes loadup { to { width: 100%; } }
#loading .load-sub { font-size: 10px; color: var(--dim); letter-spacing: 3px; margin-top: 10px; }
</style>
</head>
<body>

<!-- TOP BAR -->
<div id="topbar">
  <h1>⬡ MECH-FACE // LIP SYNC ENGINE v2.0</h1>
  <div id="sys-status"><span class="status-dot"></span>SYSTEM ONLINE</div>
</div>

<!-- MAIN -->
<div id="main">

  <!-- 3D VIEWPORT -->
  <div id="viewport">
    <div id="loading">
      <div class="load-title">MECH-FACE</div>
      <div class="load-bar-wrap"><div class="load-bar-fill"></div></div>
      <div class="load-sub">LOADING ROBOT HEAD...</div>
    </div>
  </div>

  <!-- RIGHT PANEL -->
  <div id="panel">

    <!-- INPUT -->
    <div class="panel-section">
      <div class="section-title">Input Text</div>
      <textarea id="lipsync-input" placeholder="Type something for the robot to say...&#10;e.g. Hello! How are you today?"></textarea>
      <button id="speak-btn" onclick="startLipSync()">▶ SPEAK</button>

      <!-- Waveform visualiser -->
      <div id="waveform" style="margin-top:10px;">
        <canvas id="wave-canvas" width="308" height="40"></canvas>
      </div>

      <!-- JAW METER -->
      <div id="jaw-meter-wrap">
        <div id="jaw-meter-label">JAW OPEN</div>
        <div id="jaw-meter-bar"><div id="jaw-meter-fill"></div></div>
        <div id="jaw-meter-val">0°</div>
      </div>
    </div>

    <!-- PHONEME VISUALISER -->
    <div class="panel-section">
      <div class="section-title">Phoneme Stream</div>
      <div id="phoneme-display"><span style="color:var(--dim);font-size:10px;letter-spacing:2px;">AWAITING INPUT...</span></div>
    </div>

    <!-- QUICK PHRASES -->
    <div class="panel-section">
      <div class="section-title">Quick Phrases</div>
      <div>
        <button class="phrase-btn" onclick="loadPhrase('Hello!')">Hello!</button>
        <button class="phrase-btn" onclick="loadPhrase('How are you?')">How are you?</button>
        <button class="phrase-btn" onclick="loadPhrase('Aaaahhhh!')">Aaaahhhh!</button>
        <button class="phrase-btn" onclick="loadPhrase('I am a robot.')">I am a robot.</button>
        <button class="phrase-btn" onclick="loadPhrase('Wow! Oh no!')">Wow! Oh no!</button>
        <button class="phrase-btn" onclick="loadPhrase('Beep boop bop!')">Beep boop bop!</button>
        <button class="phrase-btn" onclick="loadPhrase('My name is Mech Face.')">My name is Mech Face.</button>
      </div>
    </div>

    <!-- PHONEME REFERENCE -->
    <div class="panel-section">
      <div class="section-title">Phoneme → Jaw Map</div>
      <div class="phoneme-grid" id="phoneme-ref"></div>
    </div>

    <!-- MANUAL CONTROLS -->
    <div class="panel-section">
      <div class="section-title">Manual Controls</div>
      <div class="slider-row">
        <label>JAW <span id="v-jaw">0°</span></label>
        <input type="range" id="s-jaw" min="0" max="35" value="0"
          oninput="document.getElementById('v-jaw').textContent=this.value+'°'; setJaw(+this.value);">
      </div>
      <div class="slider-row">
        <label>EYE H <span id="v-eyeh">0°</span></label>
        <input type="range" id="s-eyeh" min="-35" max="35" value="0"
          oninput="document.getElementById('v-eyeh').textContent=this.value+'°'; setEyeH(+this.value);">
      </div>
      <div class="slider-row">
        <label>EYE V <span id="v-eyev">0°</span></label>
        <input type="range" id="s-eyev" min="-25" max="25" value="0"
          oninput="document.getElementById('v-eyev').textContent=this.value+'°'; setEyeV(+this.value);">
      </div>
      <div class="slider-row">
        <label>HEAD TURN <span id="v-turn">0°</span></label>
        <input type="range" id="s-turn" min="-45" max="45" value="0"
          oninput="document.getElementById('v-turn').textContent=this.value+'°'; if(robotGroup) robotGroup.rotation.y=+this.value*Math.PI/180;">
      </div>
      <div class="action-row">
        <button class="act-btn" id="btn-auto" onclick="toggleAuto()">▶ IDLE</button>
        <button class="act-btn" onclick="resetAll()">⟳ RESET</button>
        <button class="act-btn" id="btn-wire" onclick="toggleWire()">◫ WIRE</button>
        <button class="act-btn" id="btn-stop" onclick="stopSpeaking()">■ STOP</button>
      </div>
    </div>

  </div><!-- end panel -->
</div><!-- end main -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ═══════════════════════════════════════════════════════
//  PHONEME → JAW ANGLE MAP
//  Duration (ms) is how long to hold before moving on
//  Jaw angle is 0–35 degrees
// ═══════════════════════════════════════════════════════
const PHONEME_MAP = {
  // ── Vowels (wide open) ──────────────────────────────
  'a': { angle: 22, dur: 90,  name: 'AH'   },
  'A': { angle: 32, dur: 120, name: 'AAH'  },  // long 'a' (multiple a's)
  'e': { angle: 14, dur: 80,  name: 'EH'   },
  'E': { angle: 18, dur: 90,  name: 'EEH'  },
  'i': { angle: 10, dur: 70,  name: 'IH'   },
  'I': { angle: 14, dur: 80,  name: 'EEE'  },
  'o': { angle: 20, dur: 90,  name: 'OH'   },
  'O': { angle: 28, dur: 110, name: 'OOH'  },
  'u': { angle: 12, dur: 80,  name: 'UH'   },
  'U': { angle: 16, dur: 90,  name: 'OOO'  },
  // ── Consonants ───────────────────────────────────────
  'b': { angle: 0,  dur: 60,  name: 'B/P'  },
  'p': { angle: 0,  dur: 60,  name: 'B/P'  },
  'm': { angle: 0,  dur: 70,  name: 'M'    },
  'f': { angle: 4,  dur: 55,  name: 'F/V'  },
  'v': { angle: 4,  dur: 55,  name: 'F/V'  },
  'w': { angle: 8,  dur: 65,  name: 'W'    },
  'r': { angle: 8,  dur: 65,  name: 'R'    },
  'l': { angle: 10, dur: 65,  name: 'L'    },
  'n': { angle: 6,  dur: 60,  name: 'N'    },
  'd': { angle: 6,  dur: 55,  name: 'D/T'  },
  't': { angle: 6,  dur: 55,  name: 'D/T'  },
  's': { angle: 5,  dur: 55,  name: 'S/Z'  },
  'z': { angle: 5,  dur: 55,  name: 'S/Z'  },
  'h': { angle: 14, dur: 60,  name: 'H'    },
  'k': { angle: 8,  dur: 55,  name: 'K/G'  },
  'g': { angle: 8,  dur: 55,  name: 'K/G'  },
  'y': { angle: 10, dur: 60,  name: 'Y'    },
  'j': { angle: 12, dur: 65,  name: 'J/SH' },
  'x': { angle: 5,  dur: 55,  name: 'X'    },
  'q': { angle: 8,  dur: 55,  name: 'Q'    },
  // ── Punctuation / silence ────────────────────────────
  ' ': { angle: 0,  dur: 80,  name: 'SPC'  },
  ',': { angle: 0,  dur: 140, name: ','    },
  '.': { angle: 0,  dur: 200, name: '.'    },
  '!': { angle: 24, dur: 100, name: '!'    },
  '?': { angle: 16, dur: 100, name: '?'    },
};

// Repeated character boost — each repeat multiplies jaw angle
// "ah" → normal, "aah" → bigger, "aaaah" → max
function textToPhonemes(text) {
  const tokens = [];
  let i = 0;
  const lower = text.toLowerCase();
  while (i < lower.length) {
    const ch = lower[i];
    // Count run of same character
    let run = 1;
    while (i + run < lower.length && lower[i + run] === ch) run++;
    const base = PHONEME_MAP[ch];
    if (base) {
      // Jaw boost: runs of 1→normal, 2→+20%, 3→+45%, 4+→max
      const boost = Math.min(1.0 + (run - 1) * 0.25, 2.2);
      const angle = Math.min(Math.round(base.angle * boost), 35);
      // Duration scales with run length too (but capped)
      const dur = base.dur + Math.min((run - 1) * 25, 200);
      tokens.push({
        char: text[i],        // original case for display
        run,
        angle,
        dur,
        name: base.name,
        rawChar: ch
      });
    }
    i += run; // skip the whole run
  }
  return tokens;
}

function b64ToBuffer(b64) {
  const bin = atob(b64);
  const buf = new ArrayBuffer(bin.length);
  const u8  = new Uint8Array(buf);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return buf;
}

function parseGLB(buffer) {
  const dv      = new DataView(buffer);
  const jsonLen = dv.getUint32(12, true);
  const jsonStr = new TextDecoder().decode(new Uint8Array(buffer, 20, jsonLen));
  const gltf    = JSON.parse(jsonStr);
  const binOff  = 20 + jsonLen;
  const binLen  = dv.getUint32(binOff, true);
  const binBuf  = buffer.slice(binOff + 8, binOff + 8 + binLen);

  function get(accIdx) {
    const acc = gltf.accessors[accIdx];
    const bv  = gltf.bufferViews[acc.bufferView];
    const off = (bv.byteOffset||0) + (acc.byteOffset||0);
    const c   = {SCALAR:1,VEC2:2,VEC3:3,VEC4:4}[acc.type];
    const n   = acc.count * c;
    return {
      data: acc.componentType===5126 ? new Float32Array(binBuf, off, n)
           :acc.componentType===5123 ? new Uint16Array(binBuf, off, n)
           :                           new Uint32Array(binBuf, off, n),
      count: acc.count, comps: c
    };
  }
  const grp = new THREE.Group();
  grp.name = 'RobotHead';
  gltf.meshes.forEach((mesh, mi) => {
    const prim = mesh.primitives[0];
    const geo  = new THREE.BufferGeometry();
    const idxD = get(prim.indices);
    geo.setIndex(new THREE.BufferAttribute(
      idxD.data instanceof Uint16Array ? new Uint16Array(idxD.data) : new Uint32Array(idxD.data), 1));
    const posD = get(prim.attributes.POSITION);
    geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(posD.data), 3));
    const nrmD = get(prim.attributes.NORMAL);
    geo.setAttribute('normal',   new THREE.BufferAttribute(new Float32Array(nrmD.data), 3));
    const colD = get(prim.attributes.COLOR_0);
    geo.setAttribute('color',    new THREE.BufferAttribute(new Float32Array(colD.data), 4));
    const mat  = new THREE.MeshStandardMaterial({ vertexColors:true, metalness:0.75, roughness:0.35 });
    const m3   = new THREE.Mesh(geo, mat);
    m3.name = mesh.name; m3.castShadow = m3.receiveShadow = true;
    const nd = gltf.nodes[mi];
    if (nd.translation) m3.position.fromArray(nd.translation);
    m3.userData.basePos = m3.position.clone();
    grp.add(m3);
  });
  return grp;
}

  'LowerJaw','JawChinPlate',
  'HingeBracket_Left','HingeBracket_Right',
  'HingeScrew_Left','HingeScrew_Right',
  'ScrewHead_Left','ScrewHead_Right',
  'LowerLip','LowerLipTrim','MouthCavity',
  'MouthCorner_Left','MouthCorner_Right',
  'MouthCornerScrew_Left','MouthCornerScrew_Right',
  'VocalGrille_-0.595','VocalGrille_-0.615','VocalGrille_-0.635',
  'VocalEmitter','VocalEmitterRing',
];

function applyJaw(deg) {
  if (!robotGroup) return;
  jawCurrent = deg;
  const angle = deg * Math.PI / 180;
  const names = [...JAW_PARTS];
  Object.keys(meshMap).forEach(k => { if(k.startsWith('LowerTooth_')) names.push(k); });
  const pivot = new THREE.Vector3(0, -0.56, 0.30);
  names.forEach(name => {
    const m = meshMap[name]; if(!m) return;
    const rel = m.userData.basePos.clone().sub(pivot);
    rel.applyEuler(new THREE.Euler(angle, 0, 0));
    m.position.copy(pivot).add(rel);
    m.rotation.x = angle;
  });
  // Vocal emitter glow
  const em = meshMap['VocalEmitter'];
  if (em) {
    const g = deg > 2 ? 0.4 + 0.6 * Math.sin(Date.now() * 0.03) : 0;
    em.material.emissive = new THREE.Color(g*0.9, g*0.4, 0);
    em.material.emissiveIntensity = g * (deg / 35);
  }
  // Update UI meter
  const pct = (deg / 35) * 100;
  document.getElementById('jaw-meter-fill').style.width = pct + '%';
  document.getElementById('jaw-meter-val').textContent = Math.round(deg) + '°';
  document.getElementById('s-jaw').value = Math.round(deg);
  document.getElementById('v-jaw').textContent = Math.round(deg) + '°';
}

function setJaw(deg)  { jawTarget = deg; }
function setEyeH(deg) { eyeH = deg * Math.PI/180; updateEyes(); }
function setEyeV(deg) { eyeV = deg * Math.PI/180; updateEyes(); }
function updateEyes() {
  ['Left','Right'].forEach(s => {
    ['Eye_','EyePupil_','EyeIris_'].forEach(p => {
      const m = meshMap[p+s]; if(!m) return;
      m.rotation.y = eyeH; m.rotation.x = eyeV;
    });
  });
}

// ═══════════════════════════════════════════════════════
//  LIP SYNC ENGINE
// ═══════════════════════════════════════════════════════
function startLipSync() {
  const text = document.getElementById('lipsync-input').value.trim();
  if (!text) return;
  lsTokens  = textToPhonemes(text);
  if (!lsTokens.length) return;
  lsIdx     = 0;
  lsTimer   = 0;
  lsSpeaking = true;
  jawTarget  = 0;
  document.getElementById('speak-btn').classList.add('speaking');
  document.getElementById('speak-btn').textContent = '■ SPEAKING...';
  renderPhonemeStream(lsTokens, -1);
  startWaveform();
}

function stopSpeaking() {
  lsSpeaking = false;
  jawTarget  = 0;
  document.getElementById('speak-btn').classList.remove('speaking');
  document.getElementById('speak-btn').textContent = '▶ SPEAK';
  stopWaveform();
  renderPhonemeStream(lsTokens, -2); // all done
}

function tickLipSync(dt) {
  if (!lsSpeaking || !lsTokens.length) return;
  lsTimer += dt * 1000;
  const tok = lsTokens[lsIdx];
  if (!tok) { stopSpeaking(); return; }
  jawTarget = tok.angle;
  if (lsTimer >= tok.dur) {
    lsTimer -= tok.dur;
    renderPhonemeStream(lsTokens, lsIdx);
    lsIdx++;
    if (lsIdx >= lsTokens.length) { stopSpeaking(); }
  }
}

function loadPhrase(txt) {
  document.getElementById('lipsync-input').value = txt;
  startLipSync();
}

// ── Phoneme stream render ──────────────────────
function renderPhonemeStream(tokens, currentIdx) {
  const el = document.getElementById('phoneme-display');
  if (!tokens.length) {
    el.innerHTML = '<span style="color:var(--dim);font-size:10px;letter-spacing:2px;">AWAITING INPUT...</span>';
    return;
  }
  el.innerHTML = tokens.map((t, i) => {
    const cls = i < currentIdx ? 'ph-token done'
              : i === currentIdx ? 'ph-token active'
              : 'ph-token';
    const repeat = t.run > 1 ? `<span style="color:var(--accent2);font-size:8px;">×${t.run}</span>` : '';
    return `<div class="${cls}">
      <span class="ph-char">${escHtml(t.char)}${repeat}</span>
      <span class="ph-angle">${t.angle}°</span>
    </div>`;
  }).join('');
  // Scroll active token into view
  const active = el.querySelector('.active');
  if (active) active.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Phoneme reference grid ─────────────────────
function buildPhonemeRef() {
  const ref = document.getElementById('phoneme-ref');
  const entries = [
    ['a','AH'],['A','AAH'],['e','EH'],['i','IH'],
    ['o','OH'],['O','OOH'],['u','UH'],['h','H'],
    ['b','B/P'],['m','M'],['f','F/V'],['w','W'],
    ['l','L'],['n','N'],['s','S'],['k','K/G'],
  ];
  ref.innerHTML = entries.map(([ch, label]) => {
    const ph = PHONEME_MAP[ch];
    return `<div class="ph-ref" onclick="previewPhoneme('${ch}')">
      <span class="ph-ref-char">${ch}</span>
      <span class="ph-ref-deg">${ph.angle}°</span>
      <span class="ph-ref-name">${label}</span>
    </div>`;
  }).join('');
}

function previewPhoneme(ch) {
  const ph = PHONEME_MAP[ch]; if(!ph) return;
  jawTarget = ph.angle;
  setTimeout(() => { jawTarget = 0; }, ph.dur * 3);
}

// ═══════════════════════════════════════════════════════
//  WAVEFORM VISUALISER (fake but responsive)
// ═══════════════════════════════════════════════════════
let waveActive = false;
const wCtx = document.getElementById('wave-canvas').getContext('2d');
function drawWave() {
  const W=308, H=40;
  wCtx.clearRect(0,0,W,H);
  if (!waveActive) {
    wCtx.strokeStyle = '#1a3050';
    wCtx.lineWidth = 1;
    wCtx.beginPath(); wCtx.moveTo(0,H/2); wCtx.lineTo(W,H/2); wCtx.stroke();
    return;
  }
  const t = Date.now() * 0.003;
  const amp = (jawCurrent / 35) * 16 + 2;
  wCtx.strokeStyle = '#00c8ff';
  wCtx.lineWidth = 1.5;
  wCtx.shadowColor = '#00c8ff';
  wCtx.shadowBlur = 4;
  wCtx.beginPath();
  for (let x=0; x<W; x++) {
    const phase = x * 0.08 + t * 3;
    const y = H/2
      + Math.sin(phase) * amp
      + Math.sin(phase * 2.3 + 1) * (amp * 0.4)
      + Math.sin(phase * 0.7 - 0.5) * (amp * 0.3);
    x===0 ? wCtx.moveTo(x,y) : wCtx.lineTo(x,y);
  }
  wCtx.stroke();
  wCtx.shadowBlur = 0;
}
function startWaveform() { waveActive=true; }
function stopWaveform()  { waveActive=false; }

// ═══════════════════════════════════════════════════════
//  ORBIT CONTROLS
// ═══════════════════════════════════════════════════════
let isDrag=false, pMouse={x:0,y:0};
let orbit={theta:0.3,phi:0.1,radius:3.8};
renderer.domElement.addEventListener('mousedown',e=>{isDrag=true;pMouse={x:e.clientX,y:e.clientY};});
renderer.domElement.addEventListener('mouseup',  ()=>isDrag=false);
renderer.domElement.addEventListener('mousemove',e=>{
  if(!isDrag) return;
  orbit.theta -= (e.clientX-pMouse.x)*0.008;
  orbit.phi = Math.max(-0.5,Math.min(0.9,orbit.phi-(e.clientY-pMouse.y)*0.008));
  pMouse={x:e.clientX,y:e.clientY};
});
renderer.domElement.addEventListener('wheel',e=>{
  orbit.radius=Math.max(1.5,Math.min(8,orbit.radius+e.deltaY*0.005));
});

// ═══════════════════════════════════════════════════════
//  BUTTONS
// ═══════════════════════════════════════════════════════
function toggleAuto() {
  autoMode=!autoMode;
  const b=document.getElementById('btn-auto');
  b.classList.toggle('on',autoMode);
  b.textContent=autoMode?'⏸ IDLE':'▶ IDLE';
}
function toggleWire() {
  wireMode=!wireMode;
  if(robotGroup) robotGroup.traverse(o=>{if(o.isMesh) o.material.wireframe=wireMode;});
  document.getElementById('btn-wire').classList.toggle('on',wireMode);
}
function resetAll() {
  jawTarget=0; eyeH=0; eyeV=0; updateEyes();
  if(robotGroup) robotGroup.rotation.set(0,0,0);
  ['s-jaw','s-eyeh','s-eyev','s-turn'].forEach(id=>{ document.getElementById(id).value=0; });
  ['v-jaw','v-eyeh','v-eyev','v-turn'].forEach(id=>{ document.getElementById(id).textContent='0°'; });
  stopSpeaking();
}
window.toggleAuto=toggleAuto; window.toggleWire=toggleWire;
window.resetAll=resetAll; window.stopSpeaking=stopSpeaking;
window.startLipSync=startLipSync; window.loadPhrase=loadPhrase;
window.previewPhoneme=previewPhoneme;

// ═══════════════════════════════════════════════════════
//  RENDER LOOP
// ═══════════════════════════════════════════════════════
const LERP_SPEED = 18; // jaw smoothing speed
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();

  // Camera
  camera.position.set(
    orbit.radius * Math.sin(orbit.theta) * Math.cos(orbit.phi),
    orbit.radius * Math.sin(orbit.phi) + 0.2,
    orbit.radius * Math.cos(orbit.theta) * Math.cos(orbit.phi)
  );
  camera.lookAt(0, 0.1, 0);

  // Lip sync tick
  if (lsSpeaking) tickLipSync(dt);

  // Auto idle
  if (autoMode && !lsSpeaking && robotGroup) {
    autoTime += dt;
    const t = autoTime;
    jawTarget = Math.max(0, Math.sin(t*1.1)*18);
    eyeH = Math.sin(t*0.7) * 0.45;
    eyeV = Math.sin(t*0.5) * 0.3;
    updateEyes();
    robotGroup.rotation.y = Math.sin(t*0.3)*0.4;
    robotGroup.rotation.z = Math.sin(t*0.2)*0.1;
  }

  // Smooth jaw
  jawCurrent += (jawTarget - jawCurrent) * Math.min(LERP_SPEED * dt, 1);
  applyJaw(jawCurrent);

  // Waveform
  drawWave();

  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  const W=viewport.clientWidth, H=viewport.clientHeight;
  camera.aspect=W/H; camera.updateProjectionMatrix();
  renderer.setSize(W,H);
});
</script>
